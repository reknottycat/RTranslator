apply plugin: 'com.android.application'
configurations { ortNative }
android {
    namespace 'nie.translator.rtranslator.qnnprobe'
    packagingOptions { jniLibs { useLegacyPackaging true } }
    compileSdk 36
    ndkVersion '28.0.12674087'
    defaultConfig {
        applicationId 'nie.translator.rtranslator.qnnprobe'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '0.1-qualification'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments "-DORT_DIR=${buildDir}/ort-native" } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation('com.microsoft.onnxruntime:onnxruntime-android-qnn:1.29.0') {
        exclude group: 'com.qualcomm.qti', module: 'qnn-runtime'
    }
    // Isolated compatibility probe: official pack was exported with QAIRT 2.50.
    implementation 'com.qualcomm.qti:qnn-runtime:2.50.0'
    ortNative 'com.microsoft.onnxruntime:onnxruntime-android-qnn:1.29.0@aar'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
def unpackOrt = tasks.register('unpackOrtNative', Copy) {
    from { zipTree(configurations.ortNative.singleFile) }
    include 'headers/**', 'jni/arm64-v8a/libonnxruntime.so'
    into "${buildDir}/ort-native"
}
tasks.configureEach { t ->
    if (t.name.startsWith('configureCMake') || t.name == 'preBuild') t.dependsOn(unpackOrt)
}
