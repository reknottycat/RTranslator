apply plugin: 'com.android.application'

// CN updates keep the existing CN identity. conversationBuild is a feature/build alias, not a new app.
def conversationBuild = project.findProperty('conversationBuild') == 'true'
def qnnWhisperTest = project.findProperty('qnnWhisperTest') == 'true'
def cnBuild = project.findProperty('cnBuild') == 'true' || conversationBuild || qnnWhisperTest
def androidOrt = 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
configurations { qnnOrtNative }
// Keystore is supplied privately by the owner. Never generate a new identity to claim an upgrade.
def cnKeystore = System.getenv('RT_CN_KEYSTORE_PATH')
def cnSigningReady = cnKeystore && System.getenv('RT_CN_STORE_PASSWORD') &&
        System.getenv('RT_CN_KEY_ALIAS') && System.getenv('RT_CN_KEY_PASSWORD')
if (project.findProperty('requireCompatibleSigning') == 'true' && !cnSigningReady) {
    throw new GradleException('Compatible CN signing key is required. Do not uninstall the installed app.')
}

ext {
    supportLibraryVersion = '1.0.0'
    grpcVersion = '1.11.0'
}

android {
    namespace 'nie.translator.rtranslator'
    //compileSdkVersion 33  //33
    ndkVersion "28.0.12674087"
    defaultConfig {
        applicationId "nie.translator.rtranslator"
        manifestPlaceholders = [appLabel: qnnWhisperTest ? 'RTranslator NPU Test' : (cnBuild ? 'RTranslator CN' : '@string/app_name')]
        buildConfigField 'boolean', 'QNN_WHISPER_TEST', qnnWhisperTest.toString()
        targetSdkVersion 36   //32
        compileSdk 36
        versionName '3.0.0-beta2'
        versionCode 27
        if (cnBuild) {
            applicationIdSuffix '.cn'
            versionNameSuffix '-cn.4-meeting-repair.1'
            versionCode 32
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        if (qnnWhisperTest) {
            applicationIdSuffix '.cn.qnn'
            versionNameSuffix '-cn.qnn-test.1'
            versionCode 1
        }
        minSdkVersion 28
        externalNativeBuild {
            cmake {
                arguments '-DSPM_ENABLE_SHARED=OFF',  //sentencepiece flags
                        '-DSPM_BUILD_TEST=OFF',
                        '-DSPM_ENABLE_TCMALLOC=OFF',
                        //bergamot flags
                        '-DANDROID_ABI=arm64-v8a',
                        '-DANDROID_PLATFORM=android-28',
                        '-DANDROID_STL=c++_shared',
                        "-DANDROID_PIE=ON",
                        "-DANDROID_CPP_FEATURES=exceptions",
                        '-DCMAKE_BUILD_TYPE=Release',
                        '-DBUILD_SHARED_LIBS=OFF',
                        '-DUSE_STATIC_LIBS=ON',
                        '-DCOMPILE_CUDA=OFF',
                        '-DUSE_WASM_COMPATIBLE_SOURCE=OFF',
                        '-DTHREADS_PREFER_PTHREAD_FLAG=ON',
                        '-DUSE_TCMALLOC=OFF',
                        '-DSSPLIT_USE_INTERNAL_PCRE2:BOOL=ON',
                        '-DUSE_PATHIECPP=ON',
                        '-DBUILD_ARCH=armv8-a',
                        '-GNinja',
                        //'-DCMAKE_C_FLAGS="-O3 -fPIC -march=armv8-a -mtune=generic -ffast-math -funroll-loops -fdata-sections -ffunction-sections"',
                        //'-DCMAKE_CXX_FLAGS="-O3 -fPIC -march=armv8-a -mtune=generic -ffast-math -funroll-loops -fdata-sections -ffunction-sections"',
                        '-DCMAKE_CXX_FLAGS="-Wno-enum-constexpr-conversion"'
                cppFlags '-std=c++17'
                abiFilters 'arm64-v8a'
                if (qnnWhisperTest) {
                    arguments "-DQNN_ORT_DIR=${buildDir}/qnn-ort-native"
                }
                if (cnBuild) {
                    // Gradle's worker limit does not cap Ninja's native jobs.
                    arguments '-DCMAKE_JOB_POOLS=compile_pool=2;link_pool=1',
                            '-DCMAKE_JOB_POOL_COMPILE=compile_pool',
                            '-DCMAKE_JOB_POOL_LINK=link_pool'
                }
            }
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    if (qnnWhisperTest) {
        sourceSets.debug.manifest.srcFile 'src/qnn/AndroidManifest.xml'
        packagingOptions {
            jniLibs {
                useLegacyPackaging true
                keepDebugSymbols += ['**/libQnnHtpV*Skel.so']
                pickFirsts += ['lib/arm64-v8a/libonnxruntime.so']
            }
        }
    }

    signingConfigs {
        if (cnSigningReady) {
            cnOwner {
                storeFile file(cnKeystore)
                storePassword System.getenv('RT_CN_STORE_PASSWORD')
                keyAlias System.getenv('RT_CN_KEY_ALIAS')
                keyPassword System.getenv('RT_CN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            multiDexEnabled true
            debuggable true
        }
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled false

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources false

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig cnBuild ? (cnSigningReady ? signingConfigs.cnOwner : null) : signingConfigs.debug
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    configurations.all {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:3.0.2'
        resolutionStrategy.force "com.android.support:support-annotations:$supportLibraryVersion"
    }
    productFlavors {
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/src/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    //implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Support libraries
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation "com.google.android.material:material:1.9.0"  //1.9.0
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.recyclerview:recyclerview:1.0.0"
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation "androidx.preference:preference:1.1.0-alpha02"  //prima era 1.1.0-alpha02
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "com.github.worker8:RadioGroupPlus:1.0.1"
    //Download library
    implementation 'com.github.amitshekhariitbhu:PRDownloader:1.0.2'
    // DJL HuggingFace tokenizers wrapper
    implementation "ai.djl.android:core:0.33.0"
    implementation "ai.djl.huggingface:tokenizers:0.33.0"
    implementation "ai.djl.android:tokenizer-native:0.33.0"
    //protobuf
    implementation "com.google.protobuf:protobuf-javalite:4.33.5"
    // bouncycastle crypto lib
    implementation "org.bouncycastle:bcprov-jdk15to18:1.83"
    //lingua
    implementation "com.github.pemistahl:lingua:1.2.2"
    // VAD
    implementation 'com.github.gkonovalov.android-vad:silero:2.0.10'
    //implementation 'androidx.core:core-ktx:1.10.0'
    implementation 'androidx.work:work-runtime:2.7.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    //bluetooth communicator
    //implementation 'com.github.niedev:BluetoothCommunicator:1.0.6'
    //gallery image selector
    //implementation 'com.github.niedev:GalleryImageSelector:1.0.7'
    //ONNX Runtime
    implementation androidOrt
    if (qnnWhisperTest) {
        implementation('com.qualcomm.qti:onnxruntime-android-qnn:2.6.0') {
            transitive = false
        }
        implementation 'com.qualcomm.qti:qnn-runtime:2.50.0'
        qnnOrtNative "${androidOrt}@aar"
    }
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.13.0'   //latest.release
    //JWS parser
    implementation group: 'com.nimbusds', name: 'nimbus-jose-jwt', version: '5.1'
    implementation files('libs/sqlite4java-android-release.aar')
    //Room library (database)
    def room_version = '2.1.0'
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version" // use kapt for Kotlin
    // optional - RxJava support for Room
    implementation "androidx.room:room-rxjava2:$room_version"
    // optional - Guava support for Room, including Optional and ListenableFuture
    implementation "androidx.room:room-guava:$room_version"
    // Test helpers
    testImplementation "androidx.room:room-testing:$room_version"
    // Tests
    testImplementation 'junit:junit:4.12'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}

if (qnnWhisperTest) {
    def unpackQnnOrt = tasks.register('unpackQnnOrtNative', Copy) {
        from { zipTree(configurations.qnnOrtNative.singleFile) }
        include 'headers/**', 'jni/arm64-v8a/libonnxruntime.so'
        into "${buildDir}/qnn-ort-native"
    }
    tasks.configureEach { task ->
        if (task.name.startsWith('configureCMake') || task.name == 'preBuild') {
            task.dependsOn(unpackQnnOrt)
        }
    }
}
