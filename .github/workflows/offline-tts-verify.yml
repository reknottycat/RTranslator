name: Verify offline TTS (validation only)
on:
  workflow_dispatch:
  push:
    branches: [feat/whisper-backend-offline-tts]
    paths: ['app/**', 'gradle/**', '*.gradle', 'gradle.properties', '.github/workflows/offline-tts-verify.yml']
permissions:
  contents: read
concurrency:
  group: offline-tts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;34.0.0' 'ndk;28.0.12674087' 'cmake;3.22.1'
      - name: Unit tests and validation build, never publish an upgrade
        run: bash ./gradlew --no-daemon --max-workers=2 -PconversationBuild=true :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-tts-test-results
          path: |
            app/build/test-results/
            app/build/reports/tests/
      - name: Package verified test APK and evidence
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp app/build/outputs/apk/debug/app-debug.apk delivery/RTranslator-offline-TTS-test.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs delivery/RTranslator-offline-TTS-test.apk | tee delivery/signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging delivery/RTranslator-offline-TTS-test.apk > delivery/badging.txt
          git rev-parse HEAD > delivery/source-commit.txt
          cp docs/OFFLINE_TTS_AND_QNN_STATUS.md delivery/
          (cd delivery && sha256sum *.apk > SHA256SUMS)
          printf '%s\n' 'TEST APK: offline installed TTS engine routing; existing CPU ASR. No production QNN backend. Not hardware validated. Debug signer may not match installed app. Do not uninstall or clear data to install. Offline voice engines/models must be installed separately.' > delivery/INSTALL-FIRST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RTranslator-offline-TTS-test-apk
          path: delivery/
          if-no-files-found: error
