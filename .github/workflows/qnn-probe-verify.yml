name: Build isolated Android QNN qualification APK
on:
  workflow_dispatch:
  push:
    branches: [feat/whisper-backend-offline-tts]
    paths: ['qnn-probe/**', 'settings.gradle', '.github/workflows/qnn-probe-verify.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;34.0.0' 'ndk;28.0.12674087' 'cmake;3.22.1'
      - name: Compile only, no claim of device execution
        run: bash ./gradlew --no-daemon --max-workers=2 -PqnnProbe=true :qnn-probe:assembleDebug :qnn-probe:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-qnn-qualification-not-a-production-update
          path: qnn-probe/build/outputs/apk/
