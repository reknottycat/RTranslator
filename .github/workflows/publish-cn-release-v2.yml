name: Publish RTranslator CN beta2.2 APK

on:
  push:
    branches: [chore/publish-cn-beta2-2]
    paths: [.github/workflows/publish-cn-release-v2.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.repository == 'reknottycat/RTranslator'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require successful independent Android build and unit tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 42649225236 --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Fetch exactly the verified installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download 42649225236 \
            --repo "$GITHUB_REPOSITORY" \
            --name RTranslator-3.0.0-beta2-cn.2-arm64 \
            --dir artifact
          mapfile -t apks < <(find artifact -type f -name '*.apk')
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" RTranslator-3.0.0-beta2-cn.2-arm64.apk
          badge=$(find artifact -type f -name apk-badging.txt -print -quit)
          test -n "$badge"
          grep -Fq "versionName='3.0.0-beta2-cn.2'" "$badge"
          grep -Fq "versionCode='29'" "$badge"
          sha256sum RTranslator-3.0.0-beta2-cn.2-arm64.apk | tee SHA256SUMS
      - name: Publish public, immutable-tag candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=cn-v3.0.0-beta2.2
          cat > release-notes.md <<'EOF'
          **Unofficial RTranslator 3.0.0-beta2 CN test APK**, Android 9+ / ARM64.

          Changes:
          - Download status shows the active model, source/endpoint and failure reasons.
          - 4 MiB HTTP Range chunks, up to 14 parallel requests (28 optional), 8 source-rotation retries.
          - Crash-safe downloaded-chunk journal (`chunks.done`) and resume.
          - Download sources: GitHub, gh-proxy.org, ghproxy.imciel.com, gh-proxy.com; no unverified ModelScope content is substituted.
          - Import the original unmodified model files directly using Android's file picker.
          - Model-size and available official SHA-256 checks remain enabled.
          - Show/copy download diagnostics from within the setup screen.

          **Validation:** GitHub Actions [build + JVM tests + APK signature check](https://github.com/reknottycat/RTranslator/actions/runs/42649225236).
          This does NOT establish measured throughput or reliable access on every mainland-China carrier; test on your phone.
          **Debug-signed.** If upgrading from an APK signed with another key, Android requires uninstall first. Back up any stored models and application data before uninstalling.

          Code: https://github.com/reknottycat/RTranslator/tree/feat/cn-model-import-source-log-v2

          SHA-256:
          EOF
          cat SHA256SUMS >> release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" RTranslator-3.0.0-beta2-cn.2-arm64.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" RTranslator-3.0.0-beta2-cn.2-arm64.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target 9b48b3ff56e57b385b53ff3812cb2c77a152b046 \
              --title "RTranslator CN 3.0.0-beta2.2: model import + download diagnostics" \
              --notes-file release-notes.md \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
