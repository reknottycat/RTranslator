name: Android CN APK
on:
  workflow_dispatch:
  push:
    branches: [feat/cn-download-fallback-beta2]
  pull_request:
    branches: [development, v3.00]
permissions:
  contents: read
concurrency:
  group: android-cn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;34.0.0' 'ndk;28.0.12674087' 'cmake;3.22.1'
      - run: bash ./gradlew --no-daemon --max-workers=2 -PcnBuild=true :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK
        run: |
          mkdir -p app/build/verification
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > app/build/verification/apk-signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > app/build/verification/apk-badging.txt
          sha256sum "$APK" > app/build/verification/SHA256SUMS
          git rev-parse HEAD > app/build/verification/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RTranslator-CN-arm64
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/verification/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
