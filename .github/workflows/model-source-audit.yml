name: Audit exact model sources
on:
  workflow_dispatch:
  push:
    branches: [chore/model-source-audit]
    paths: ['tools/verify_modelscope_mirrors.py', '.github/workflows/model-source-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - name: Verify mirror file identity and range responses
        run: python tools/verify_modelscope_mirrors.py
      - name: Preserve measured source evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: verified ModelScope mirror mapping and byte checks'
            git push origin HEAD:chore/model-source-audit
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-modelscope-sources
          path: reports/
          if-no-files-found: error
